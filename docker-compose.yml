services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: file:/data/app.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VECTOR_STORE: chroma
      CHROMA_URL: http://chromadb:8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_data:/data
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    # Keep the image tag pinned; check client compatibility before upgrading it.
    image: chromadb/chroma:1.0.0
    ports:
      - "127.0.0.1:8000:8000"   # not exposed beyond localhost; put auth/TLS in front before exposing it
    volumes:
      - ./data/chroma:/data     # vectors live on your disk, like `bun run chroma`
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  backend_data:
